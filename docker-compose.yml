services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: rag-backend-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - rag-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: rag-frontend-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
      - DEFAULT_USER_ID=dev-user
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
