name: Build and Push Docker Images to Docker Hub

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image (FastAPI)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agentic-bot-azure-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/agentic-bot-azure-backend:${{ github.sha }}

      - name: Build and Push Frontend Image (Streamlit)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agentic-bot-azure-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/agentic-bot-azure-frontend:${{ github.sha }}
